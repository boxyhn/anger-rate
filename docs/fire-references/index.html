<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AngerRate · 불 디자인 레퍼런스</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f6;color:#292929;font:13px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}header{padding:36px 32px 24px;max-width:1500px;margin:auto}h1{font-size:25px;letter-spacing:-.8px;margin:0 0 12px;font-weight:600}.intro{color:#858585;line-height:1.8;margin:0}.toolbar{position:sticky;top:0;z-index:3;padding:15px 32px;background:#f7f7f6f5;border-bottom:1px solid #e5e5e5;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #ddd;background:#fff;color:#555;border-radius:7px;padding:8px 11px}button.active{background:#333;color:#fff;border-color:#333}button:focus-visible,a:focus-visible{outline:2px solid #888;outline-offset:3px}input,select{border:1px solid #ddd;padding:8px;border-radius:7px;background:#fff;color:#555}input{width:190px}.count{margin-left:auto;color:#999;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:16px;padding:25px 32px;max-width:1500px;margin:auto}.card{background:#fff;border:1px solid #e4e4e4;border-radius:10px;overflow:hidden;position:relative}.art{height:177px;display:grid;place-items:center;background:#fff;cursor:zoom-in;position:relative;width:100%;border:0;border-radius:0;padding:20px}.art img{width:100%;height:135px;object-fit:contain}.art.dark{background:#2b2b2b}.art .error{font-size:11px;color:#999;line-height:1.8;text-align:center}.number{position:absolute;top:10px;left:11px;font-size:10px;color:#aaa;z-index:1;background:#ffffffb0;border-radius:3px;padding:2px 3px}.star{position:absolute;top:7px;right:7px;z-index:2;border:0;background:#ffffffdd;color:#999;padding:5px 7px;font-size:17px}.star.selected{color:#ad6f35}.info{padding:13px 14px 14px;border-top:1px solid #f1f1f1}.title{font-size:12px;font-weight:550;line-height:1.5;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#aaa;margin-bottom:9px}.note{font-size:11px;line-height:1.6;color:#777;min-height:35px;margin:0 0 9px}.source{color:#666;font-size:10px;text-decoration:none;border-bottom:1px solid #ccc}.empty{text-align:center;padding:70px;color:#999;grid-column:1/-1}footer{color:#999;font-size:11px;line-height:1.8;padding:15px 32px 40px;max-width:1500px;margin:auto}dialog{border:1px solid #ddd;border-radius:15px;max-width:760px;width:90vw;padding:24px;background:#fafafa;color:#333}dialog::backdrop{background:#0008}dialog img{display:block;width:100%;height:390px;object-fit:contain;background:#fff;border-radius:8px}dialog h2{font-size:18px}dialog .close{float:right;margin-bottom:15px}.details{line-height:1.8;color:#777;font-size:12px}.no-image{padding:50px;text-align:center}.loading{padding:50px;color:#999}.source-link{word-break:break-all}@media(max-width:560px){header{padding:26px 16px}.toolbar{padding:12px 16px}.grid{padding:16px;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.art{height:140px;padding:18px}.art img{height:105px}.info{padding:10px}.count{width:100%}input{width:145px}dialog img{height:260px}}
</style></head><body><header><h1>불 디자인 레퍼런스 100</h1><p class="intro">촛불 · 불꽃 · 캠프파이어 — 미니멀한 형태를 비교하기 위한 레퍼런스 모음.<br>카드를 누르면 확대됩니다. 마음에 드는 것은 ☆로 모아두세요.</p></header>
<div class="toolbar"><button data-category="all" class="active">전체</button><button data-category="candle">촛불</button><button data-category="flame">불꽃</button><button data-category="campfire">캠프파이어</button><button data-category="identity">로고·모션</button><select id="style" aria-label="형태 필터"><option value="all">모든 표현</option><option value="solid">면·실루엣</option><option value="line">선</option><option value="flat">플랫·색</option></select><input id="search" placeholder="제목·제작자 검색" aria-label="검색"><button id="favorites">☆ 선택한 것</button><button id="export">선택 번호 복사</button><span id="count" class="count">불러오는 중</span></div>
<div class="grid" id="grid"><div class="loading">레퍼런스를 불러오는 중입니다.</div></div><footer id="footer">외부 제작자의 디자인을 비교 목적으로 원본 URL에서 표시합니다. 자산을 앱에 사용하거나 재배포한 것이 아닙니다. 각 카드에 제작자와 출처를 연결했습니다. 외부 이미지가 막히면 원본 보기로 확인할 수 있습니다.</footer>
<dialog id="detail"><button class="close" id="close">닫기</button><div id="detailBody"></div></dialog>
<script>
let refs=[],category='all',onlyFav=false;const key='anger-fire-reference-favorites-v1';let selected=new Set();try{selected=new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch{}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={candle:'촛불',flame:'불꽃',campfire:'캠프파이어',identity:'로고',motion:'모션'};
function safeURL(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function failImage(img){const area=img.parentElement;img.remove();const msg=document.createElement('span');msg.className='error';msg.textContent='외부 이미지 로딩 실패 · 원본에서 확인';area.append(msg)}
function render(){const term=$('search').value.toLowerCase(),style=$('style').value;const list=refs.filter(r=>(category==='all'||r.category===category||(category==='identity'&&r.category==='motion'))&&(!onlyFav||selected.has(r.id))&&(style==='all'||r.style===style)&&(!term||[r.title,r.author,r.note].join(' ').toLowerCase().includes(term)));$('count').textContent=`${list.length} / ${refs.length}개 · 선택 ${selected.size}개`;$('grid').innerHTML=list.map(r=>`<article class="card"><span class="number">${String(r.number).padStart(3,'0')}</span><button class="star ${selected.has(r.id)?'selected':''}" data-star="${esc(r.id)}" aria-label="${r.number}번 선택" aria-pressed="${selected.has(r.id)}">${selected.has(r.id)?'★':'☆'}</button><button class="art" data-open="${esc(r.id)}" aria-label="${esc(r.title)} 확대"><img src="${esc(safeURL(r.image_url))}" alt="${esc(r.title)}" loading="lazy" referrerpolicy="no-referrer"></button><div class="info"><h2 class="title" title="${esc(r.title)}">${esc(r.title)}</h2><div class="meta">${esc(names[r.category]||r.category)} · ${esc(r.author)}</div><p class="note">${esc(r.note)}</p><a class="source" href="${esc(safeURL(r.source_url))}" target="_blank" rel="noopener noreferrer">원본 보기 ↗</a></div></article>`).join('')||'<div class="empty">해당하는 레퍼런스가 없습니다.</div>';document.querySelectorAll('.art img').forEach(i=>i.onerror=()=>failImage(i));}
$('grid').onclick=e=>{const star=e.target.closest('[data-star]');if(star){const id=star.dataset.star;selected.has(id)?selected.delete(id):selected.add(id);try{localStorage.setItem(key,JSON.stringify([...selected]))}catch{}render();return}const open=e.target.closest('[data-open]');if(open){const r=refs.find(x=>x.id===open.dataset.open);$('detailBody').innerHTML=`<img src="${esc(safeURL(r.image_url))}" alt="${esc(r.title)}" referrerpolicy="no-referrer"><h2>${r.number}. ${esc(r.title)}</h2><p class="details">${esc(r.note)}<br>${esc(r.author)} · ${esc(names[r.category]||r.category)}<br>확인: ${esc(r.collection_date)} · ${esc(r.verified||'출처 확인')}</p><a class="source-link" target="_blank" rel="noopener noreferrer" href="${esc(safeURL(r.source_url))}">원본 디자인 보기 ↗</a>`;$('detail').showModal()}};
$('close').onclick=()=>$('detail').close();$('detail').onclick=e=>{if(e.target===$('detail'))$('detail').close()};document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('active',x===b));render()});$('style').onchange=render;$('search').oninput=render;$('favorites').onclick=()=>{onlyFav=!onlyFav;$('favorites').classList.toggle('active',onlyFav);render()};$('export').onclick=async()=>{const text=refs.filter(r=>selected.has(r.id)).map(r=>`${r.number}. ${r.title}\n${r.source_url}`).join('\n\n');if(!text){$('export').textContent='먼저 ☆를 골라주세요';return}try{await navigator.clipboard.writeText(text);$('export').textContent='복사했습니다'}catch{$('detailBody').textContent=text;$('detail').showModal()}};
fetch('references.json').then(r=>{if(!r.ok)throw Error('data');return r.json()}).then(data=>{refs=data;render()}).catch(()=>$('grid').innerHTML='<div class="empty">데이터를 준비 중입니다.</div>');
</script></body></html>
